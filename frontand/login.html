<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - +Português</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: #2c3e50;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container { max-width: 400px; width: 100%; margin: 0 20px; }
        
        .header-mini { text-align: center; margin-bottom: 2rem; }
        
        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #e74c3c;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.5rem;
        }
        .logo::before { content: "📚"; font-size: 2rem; }
        
        .subtitle { color: #34495e; font-size: 1rem; }
        


        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
        }
        
        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #e74c3c, #f39c12, #27ae60, #3498db);
        }
        
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        .login-header p { color: #7f8c8d; font-size: 0.95rem; }
        
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #34495e;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background: #fff;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
            transform: translateY(-1px);
        }
        
        .form-group input::placeholder { color: #bdc3c7; }
        
        .form-group.error input {
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }
        
        .error-text {
            color: #e74c3c;
            font-size: 0.8rem;
            margin-top: 0.3rem;
            display: none;
        }
        
        .form-group.error .error-text { display: block; }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .checkbox-wrapper input[type="checkbox"] { width: auto; margin: 0; }
        .checkbox-wrapper label { margin: 0; font-size: 0.85rem; color: #7f8c8d; }
        
        .forgot-password {
            color: #3498db;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }
        .forgot-password:hover { color: #2980b9; text-decoration: underline; }
        
        .btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            margin-bottom: 1rem;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn.loading::after {
            content: "";
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        
        .divider {
            text-align: center;
            margin: 1.5rem 0;
            position: relative;
            color: #bdc3c7;
            font-size: 0.85rem;
        }
        
        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e1e8ed;
            z-index: 1;
        }
        
        .divider span {
            background: rgba(255, 255, 255, 0.95);
            padding: 0 1rem;
            position: relative;
            z-index: 2;
        }
        
        .signup-link {
            text-align: center;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        .signup-link a {
            color: #e74c3c;
            text-decoration: none;
            font-weight: 600;
        }
        .signup-link a:hover { text-decoration: underline; }
        
        .back-home {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 10;
        }
        
        .back-home a {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #34495e;
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            transition: all 0.3s ease;
        }
        
        .back-home a:hover {
            background: white;
            transform: translateX(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        /* Toast Notifications */
        .toast {
            position: fixed;
            top: 100px;
            right: 20px;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 9999;
            animation: slideIn 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            min-width: 300px;
        }
        
        .toast.success { border-left: 4px solid #27ae60; }
        .toast.error { border-left: 4px solid #e74c3c; }
        .toast.info { border-left: 4px solid #3498db; }
        
        .toast-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        
        .toast-content {
            flex: 1;
        }
        
        .toast-title {
            font-weight: 600;
            margin-bottom: 0.2rem;
            color: #2c3e50;
        }
        
        .toast-message {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(400px); opacity: 0; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .container { margin: 0 15px; }
            .login-card { padding: 2rem 1.5rem; }
            .logo { font-size: 2.2rem; }
            .back-home { top: 1rem; left: 1rem; }
            .toast {
                right: 10px;
                left: 10px;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="back-home">
        <a href="index.html">← Voltar ao início</a>
    </div>

    <div class="container">
        <div class="header-mini">
            <a href="index.html" class="logo">+Português</a>
            <p class="subtitle">O seu banco de dados de aprendizado</p>
        </div>

        <div class="login-card">
            <div class="login-header">
                <h1>Entrar</h1>
                <p>Acesse sua conta e continue aprendendo</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="seu@email.com"
                        required
                        autocomplete="email"
                    >
                    <div class="error-text">E-mail inválido</div>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Sua senha"
                        required
                        autocomplete="current-password"
                    >
                    <div class="error-text">Senha é obrigatória</div>
                </div>

                <div class="checkbox-group">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Lembrar de mim</label>
                    </div>
                    <a href="#" class="forgot-password">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    Entrar
                </button>
            </form>

            <div class="divider"><span>ou</span></div>

            <div class="signup-link">
                Não tem uma conta? <a href="signup.html">Cadastre-se aqui</a>
            </div>
        </div>
    </div>

    <script>
    // Sistema de Toast Notifications
    function showToast(message, type = 'success', title = '') {
        const icons = {
            success: '✅',
            error: '❌',
            info: 'ℹ️'
        };
        
        const titles = {
            success: title || 'Sucesso!',
            error: title || 'Erro!',
            info: title || 'Informação'
        };
        
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `
            <div class="toast-icon">${icons[type]}</div>
            <div class="toast-content">
                <div class="toast-title">${titles[type]}</div>
                <div class="toast-message">${message}</div>
            </div>
        `;
        
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.style.animation = 'slideOut 0.3s ease-out';
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }

    // Validação de campos
    function validateField(field) {
        const value = field.value.trim();
        const group = field.closest('.form-group');
        
        if (!value) {
            group.classList.add('error');
            return false;
        }
        
        if (field.type === 'email' && !value.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
            group.classList.add('error');
            return false;
        }
        
        group.classList.remove('error');
        return true;
    }

    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

        [emailInput, passwordInput].forEach(input => {
            input.addEventListener('input', () => {
                input.closest('.form-group').classList.remove('error');
            });
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const emailValid = validateField(emailInput);
            const passwordValid = validateField(passwordInput);
            
            if (!emailValid || !passwordValid) {
                showToast('Por favor, preencha todos os campos corretamente', 'error');
                return;
            }

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            loginBtn.disabled = true;
            loginBtn.classList.add("loading");
            const originalText = loginBtn.textContent;
            loginBtn.textContent = "Entrando";

            try {
                const resp = await fetch("http://127.0.0.1:8000/auth/login", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ email, password })
                });

                const data = await resp.json();

                if (!resp.ok) {
                    throw new Error(data.detail || "Erro ao fazer login");
                }

                localStorage.setItem("token", data.token);
                localStorage.setItem("user_id", data.user_id);
                localStorage.setItem("user_name", data.user_name);
                localStorage.setItem("user_email", data.user_email);

                showToast('Login realizado! Redirecionando...', 'success');

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1500);

            } catch (err) {
                console.error(err);
                showToast(err.message, 'error', 'Falha no login');
                loginBtn.disabled = false;
                loginBtn.classList.remove("loading");
                loginBtn.textContent = originalText;
            }
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });
    });
</script>

</body>
</html>
